[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sst"
version = "3.4.1"
description = "Stability Sample Tracker"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<0.116",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["sst"]

[tool.setuptools.package-data]
sst = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sst --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults
