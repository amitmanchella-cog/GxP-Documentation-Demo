name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: pytest
        run: pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml | tee reports/pytest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: reports/
