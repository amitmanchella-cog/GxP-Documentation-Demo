regime: GCP
label: GCP (ICH E6(R3), 21 CFR 312)
record_controls:
  audit_trail_on: [create, update, delete]
  reason_required_on: [update, delete]
  reason_min_length: 15
  deletion: soft
  second_person_verification_on_oos_change: false
results:
  rounding: half_up
  compare_on: reportable
  limit_inclusive: true
retention:
  records_years: 25
  audit_trail_years: 25
e_signature:
  required_for: [investigator_signoff, amendment_verification]
